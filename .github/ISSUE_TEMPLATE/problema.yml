name: Relatar um problema
description: Algo não funcionou como deveria no simulador
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o simulador! Problemas de **segurança** não devem ser abertos aqui: veja o SECURITY.md.
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para repetir
      placeholder: |
        1. Abri o exemplo "Meio-somador"
        2. Cliquei na chave A
        3. ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do simulador
      description: Aparece no canto superior direito da tela.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: dropdown
    id: navegador
    attributes:
      label: Navegador
      options: [Microsoft Edge, Google Chrome, Mozilla Firefox, Safari, Outro]
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options: [Windows, Linux, macOS, Android, iOS ou iPadOS, Outro]
  - type: textarea
    id: extra
    attributes:
      label: Circuito, prints ou observações
      description: Arraste para cá o circuito salvo (.json) ou imagens. Não envie dados pessoais de alunos.
