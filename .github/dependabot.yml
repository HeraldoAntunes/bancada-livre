# Dependabot: uma vez por mês, abre um pedido de mudança (pull request) quando sai versão nova das actions ou das
# bibliotecas do simulador. Nada é aplicado sozinho: cada pedido só entra se o mantenedor aceitar.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # versão grande (React, Vite, TypeScript, Vitest, ESLint...) muda a forma de usar a biblioteca: é migração
    # planejada, com trabalho e testes próprios, e não pedido automático
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
