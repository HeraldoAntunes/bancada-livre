ShortDescription: Free and open educational digital logic simulator for the classroom (interface in Brazilian Portuguese).
Description: |-
  Workbench to build and test digital circuits: logic gates, flip-flops, counters, 7-segment display and 74xx ICs with
  the real pinout. Shows the truth table, Karnaugh map and timeline, checks the circuit against an answer key and
  includes 40 example circuits. Works offline, no account needed. Uses Microsoft Edge WebView2, included in Windows 11
  and updated Windows 10. The interface is in Brazilian Portuguese.
