ShortDescription: Simulador didático de lógica digital, livre e gratuito, para a sala de aula.
Description: |-
  Bancada para montar e testar circuitos digitais: portas lógicas, flip-flops, contadores, display de 7 segmentos e CIs
  da série 74xx com a pinagem real. Mostra a tabela-verdade, o mapa de Karnaugh e a linha do tempo, confere o circuito
  com um gabarito e traz 40 circuitos de exemplo. Funciona sem internet e sem conta. Usa o Microsoft Edge WebView2,
  que vem no Windows 11 e nos Windows 10 atualizados.
