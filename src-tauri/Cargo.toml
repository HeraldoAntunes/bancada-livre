# Bancada Livre · © 2026 Heraldo Antunes · SPDX-License-Identifier: MIT
# Programa do Windows: janela própria (Tauri 2 com o WebView2) com o simulador embutido. Sem rede.
[package]
name = "bancada-livre"
version = "2.1.1"
description = "Bancada Livre: simulador didático de lógica digital"
authors = ["Heraldo Antunes"]
edition = "2021"
license = "MIT"

[[bin]]
name = "BancadaLivre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# sem a "compression" (brotli) do padrão: com a página comprimida dentro, o exe levava 1 alerta de 75 no VirusTotal
# (Trapmine, rodada 3 de 29/10/2026); sem ela, 0 de 75. O exe fica até menor (sai o descompressor).
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
